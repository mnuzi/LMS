<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Library Management System 2026</title>
    <link rel="icon" href="images/Library_Management_System.jpg" type="image/x-icon">
</head>
<body class="page-dashboard">

    <!-- LEFT PART: Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <img src="images/Library_Management_System.jpg" alt="Library Logo">
            <strong>Library Management</strong>
            <span>Est. 2026</span>
        </div>

        <nav>
            <a class="nav-link" href="index.html">
                Dashboard
            </a>
            <a class="nav-link" href="add_book.html">
                Add Book
            </a>
            <a class="nav-link" href="remove_book.html">
                Remove Book
            </a>
            <a class="nav-link" href="view_borrowed.html">
                View Borrowed Books
            </a>
            <a class="nav-link" href="view_available.html">
                View Available Books
            </a>
            <a class="nav-link" href="manage_users.html">
                Manage User Accounts
            </a>
            <a class="nav-link" href="search_books.html">
                Search Books
            </a>
        </nav>
    </aside>

    <!-- RIGHT PART: Main content -->
    <main class="main">
        <h1>Available Books</h1>
        <div id="list" class="book-grid"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="db.js"></script>
    <script>
        async function loadAvailable() {
            // books where member_id is empty (null) are available
            const { data: books } = await db.from("books").select("*").is("member_id", null).order("title");
            const { data: members } = await db.from("members").select("*").order("name");
            // build the drop-down list of members
            let options = '<option value="">Choose member</option>';
            for (const m of members) options += `<option value="${m.id}">${safe(m.name)}</option>`;
            let html = "";
            for (const b of books) {
                html += `<div class="book-card">
                    <div class="book-cover ${coverClass(b.title)}">${safe(b.title)}<small>${safe(b.author)}</small></div>
                    <select class="search-box" id="m-${b.id}">${options}</select>
                    <button class="btn" onclick="borrowBook('${b.id}')">Borrow</button></div>`;
            }
            document.getElementById("list").innerHTML = html || "<p>No books are available.</p>";
        }
        async function borrowBook(id) {
            const memberId = document.getElementById("m-" + id).value;
            if (!memberId) { alert("Choose a member first"); return; }
            // due in 14 days
            const due = new Date(Date.now() + 14 * 86400000).toISOString().slice(0, 10);
            const { error } = await db.from("books").update({ member_id: memberId, due_date: due }).eq("id", id);
            if (error) { alert(error.message); return; }
            // also save a row in the "loans" history table
            await db.from("loans").insert({ book_id: id, member_id: memberId, due_date: due });
            alert("Borrowed. Due on " + due);
            loadAvailable();
        }
        loadAvailable();
    </script>
</body>
</html>
