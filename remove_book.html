<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Library Management System 2026</title>
    <link rel="icon" href="images/Library_Management_System.jpg" type="image/x-icon">
</head>
<body class="page-dashboard">

    <!-- LEFT PART: Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <img src="images/Library_Management_System.jpg" alt="Library Logo">
            <strong>Library Management</strong>
            <span>Est. 2026</span>
        </div>

        <nav>
            <a class="nav-link" href="index.html">
                Dashboard
            </a>
            <a class="nav-link" href="add_book.html">
                Add Book
            </a>
            <a class="nav-link" href="remove_book.html">
                Remove Book
            </a>
            <a class="nav-link" href="view_borrowed.html">
                View Borrowed Books
            </a>
            <a class="nav-link" href="view_available.html">
                View Available Books
            </a>
            <a class="nav-link" href="manage_users.html">
                Manage User Accounts
            </a>
            <a class="nav-link" href="search_books.html">
                Search Books
            </a>
        </nav>
    </aside>

    <!-- RIGHT PART: Main content -->
    <main class="main">
        <h1>Remove Book</h1>
        <div id="list"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="db.js"></script>
    <script>
        async function loadBooks() {
            // get every book from the "books" table
            const { data: books, error } = await db.from("books").select("*").order("title");
            if (error) { alert(error.message); return; }
            let html = "";
            for (const b of books) {
                // a borrowed book cannot be removed
                const disabled = b.member_id ? "disabled" : "";
                html += `<div class="box panel list-row" style="margin-bottom:12px">
                    <span><strong>${safe(b.title)}</strong><br>${safe(b.author)}</span>
                    <button class="btn" ${disabled} onclick="removeBook('${b.id}')">Remove</button></div>`;
            }
            document.getElementById("list").innerHTML = html || "<p>No books in the library.</p>";
        }
        async function removeBook(id) {
            if (!confirm("Remove this book?")) return;
            const { error } = await db.from("books").delete().eq("id", id);
            if (error) alert(error.message);
            loadBooks();
        }
        loadBooks();
    </script>
</body>
</html>
