<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Library Management System 2026</title>
    <link rel="icon" href="images/Library_Management_System.jpg" type="image/x-icon">
</head>
<body class="page-dashboard">

    <!-- LEFT PART: Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <img src="images/Library_Management_System.jpg" alt="Library Logo">
            <strong>Library Management</strong>
            <span>Est. 2026</span>
        </div>

        <nav>
            <a class="nav-link" href="index.html">
                Dashboard
            </a>
            <a class="nav-link" href="add_book.html">
                Add Book
            </a>
            <a class="nav-link" href="remove_book.html">
                Remove Book
            </a>
            <a class="nav-link" href="view_borrowed.html">
                View Borrowed Books
            </a>
            <a class="nav-link" href="view_available.html">
                View Available Books
            </a>
            <a class="nav-link" href="manage_users.html">
                Manage User Accounts
            </a>
            <a class="nav-link" href="search_books.html">
                Search Books
            </a>
        </nav>
    </aside>

    <!-- RIGHT PART: Main content -->
    <main class="main">
        <h1>Add New Books Library</h1>
        <form id="form" class="box panel form">
            <input class="search-box" name="title" placeholder="Title" required>
            <input class="search-box" name="author" placeholder="Author" required>
            <input class="search-box" name="isbn" placeholder="ISBN">
            <input class="search-box" name="category" placeholder="Category (e.g. Fiction)">
            <button class="btn">Add book</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="db.js"></script>
    <script>
        // Runs when the form is submitted
        document.getElementById("form").addEventListener("submit", async function (e) {
            e.preventDefault();                       // stop the page from reloading
            const f = this.elements;
            // insert a new row into the "books" table
            const { error } = await db.from("books").insert({
                title: f.title.value, author: f.author.value,
                isbn: f.isbn.value, category: f.category.value
            });
            if (error) { alert(error.message); return; }
            alert("Book added!");
            this.reset();
        });
    </script>
</body>
</html>
